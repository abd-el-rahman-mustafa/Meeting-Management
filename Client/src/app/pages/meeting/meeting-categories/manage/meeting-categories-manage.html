<div class="max-w-4xl p-6">
  <div class="mb-6">
    <h1 class="font-['Playfair_Display'] text-2xl font-bold text-[#0C447C]">{{ pageTitle }}</h1>
  </div>

  @if (loading) {
    <div class="rounded-xl border border-gray-100 bg-white p-8 text-center text-sm text-gray-400">
      {{ lang() === 'en' ? 'Loading category...' : 'جاري تحميل التصنيف...' }}
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">{{ lang() === 'en' ? 'Code' : 'الكود' }}</label>
          <input
            formControlName="code"
            type="text"
            class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm outline-none focus:border-[#0C447C]"
            [placeholder]="lang() === 'en' ? 'Enter category code' : 'ادخل كود التصنيف'"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">{{ lang() === 'en' ? 'Name (English)' : 'الاسم (إنجليزي)' }}</label>
          <input
            formControlName="name"
            type="text"
            class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm outline-none focus:border-[#0C447C]"
            [placeholder]="lang() === 'en' ? 'Enter english name' : 'ادخل الاسم بالانجليزية'"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">{{ lang() === 'en' ? 'Name (Arabic)' : 'الاسم (عربي)' }}</label>
          <input
            formControlName="nameAr"
            type="text"
            class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm outline-none focus:border-[#0C447C]"
            [placeholder]="lang() === 'en' ? 'Enter arabic name' : 'ادخل الاسم بالعربية'"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">{{ lang() === 'en' ? 'Description (English)' : 'الوصف (إنجليزي)' }}</label>
          <textarea
            rows="4"
            formControlName="description"
            class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm outline-none focus:border-[#0C447C]"
            [placeholder]="lang() === 'en' ? 'Enter english description' : 'ادخل الوصف بالانجليزية'"
          ></textarea>
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700">{{ lang() === 'en' ? 'Description (Arabic)' : 'الوصف (عربي)' }}</label>
          <textarea
            rows="4"
            formControlName="descriptionAr"
            class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm outline-none focus:border-[#0C447C]"
            [placeholder]="lang() === 'en' ? 'Enter arabic description' : 'ادخل الوصف بالعربية'"
          ></textarea>
        </div>
      </div>

      <div class="flex items-center gap-2 pt-2">
        <button
          type="button"
          (click)="backToList()"
          class="rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50"
        >
          {{ lang() === 'en' ? 'Cancel' : 'إلغاء' }}
        </button>
        <button
          type="submit"
          [disabled]="saving"
          class="rounded-lg bg-[#0C447C] px-4 py-2 text-sm font-semibold text-white hover:bg-[#0a3a6a] disabled:opacity-70"
        >
          {{ submitLabel }}
        </button>
      </div>
    </form>
  }
</div>
